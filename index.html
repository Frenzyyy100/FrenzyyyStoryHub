<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="robots" content="noindex,noarchive,nosnippet"/>
  <meta name="description" content="NovéLore has been archived and is no longer publicly accessible."/>
  <title>NovéLore — Archived</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/VOiHDlz.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #1A0D05;
      --bg-card:      #231007;
      --bg-elev:      #3B1A08;
      --text:         #FFF0E6;
      --muted:        #C4926A;
      --faint:        #7A4830;
      --carrot:       #E8622A;
      --carrot-d:     #C44B1A;
      --carrot-l:     #F4924A;
      --carrot-pale:  #FDDBB8;
      --amber:        #F5B942;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    /* ── Background atmosphere ── */
    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow-1 {
      position: absolute;
      width: 700px; height: 500px;
      top: 50%; left: 50%;
      transform: translate(-50%, -40%);
      background: radial-gradient(ellipse, rgba(232,98,42,0.09) 0%, transparent 65%);
      animation: breathe 7s ease-in-out infinite;
    }
    .bg-glow-2 {
      position: absolute;
      width: 400px; height: 400px;
      bottom: -80px; right: -80px;
      background: radial-gradient(ellipse, rgba(245,185,66,0.05) 0%, transparent 60%);
      animation: breathe 9s 2s ease-in-out infinite;
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(232,98,42,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,98,42,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
    }
    @keyframes breathe {
      0%, 100% { opacity: .5; transform: translate(-50%,-40%) scale(1); }
      50%       { opacity: 1;  transform: translate(-50%,-40%) scale(1.08); }
    }

    /* ── Particles ── */
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--carrot);
      pointer-events: none;
      opacity: 0;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(0) translateX(0) scale(0);   opacity: 0; }
      8%   { opacity: .35; transform: scale(1); }
      90%  { opacity: .1; }
      100% { transform: translateY(-110vh) translateX(30px) scale(.6); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative; z-index: 1;
      text-align: center;
      padding: 52px 48px 44px;
      max-width: 460px;
      width: calc(100% - 40px);
      background: linear-gradient(160deg, #2A1108 0%, #1F0D06 100%);
      border: 1px solid rgba(232,98,42,0.14);
      border-radius: 22px;
      box-shadow:
        0 40px 100px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 1px 0 rgba(232,98,42,.12) inset;
      animation: card-enter .9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(28px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Corner accents */
    .corner {
      position: absolute;
      width: 18px; height: 18px;
      border-color: rgba(232,98,42,.22);
      border-style: solid;
      opacity: .8;
    }
    .c-tl { top: 14px; left: 14px;  border-width: 1px 0 0 1px; border-radius: 4px 0 0 0; }
    .c-tr { top: 14px; right: 14px; border-width: 1px 1px 0 0; border-radius: 0 4px 0 0; }
    .c-bl { bottom: 14px; left: 14px;  border-width: 0 0 1px 1px; border-radius: 0 0 0 4px; }
    .c-br { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; border-radius: 0 0 4px 0; }

    /* ── Icon ── */
    .icon-ring {
      width: 68px; height: 68px;
      margin: 0 auto 28px;
      position: relative;
      animation: pop .7s .1s cubic-bezier(.16,1,.3,1) both;
    }
    .icon-ring svg.ring-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      animation: ring-spin 14s linear infinite;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    .icon-inner {
      position: absolute;
      inset: 10px;
      background: rgba(232,98,42,.1);
      border: 1px solid rgba(232,98,42,.22);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-inner svg { width: 24px; height: 24px; color: var(--carrot); }
    @keyframes pop {
      from { opacity: 0; transform: scale(.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Typography ── */
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.35rem;
      font-weight: 900;
      color: var(--amber);
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 16px;
      animation: fade-up .8s .15s cubic-bezier(.16,1,.3,1) both;
    }
    .logo em { color: var(--carrot-l); font-style: normal; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      background: rgba(232,98,42,.09);
      border: 1px solid rgba(232,98,42,.22);
      border-radius: 999px;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--carrot);
      margin-bottom: 26px;
      animation: fade-up .8s .2s cubic-bezier(.16,1,.3,1) both;
    }
    .badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--carrot);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .divider {
      width: 56px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(232,98,42,.35), transparent);
      margin: 0 auto 24px;
      animation: fade-up .8s .22s cubic-bezier(.16,1,.3,1) both;
    }

    .message {
      font-size: .91rem;
      line-height: 1.75;
      color: var(--muted);
      margin-bottom: 32px;
      animation: fade-up .8s .27s cubic-bezier(.16,1,.3,1) both;
    }
    .message strong {
      color: var(--carrot-pale);
      font-weight: 500;
    }

    /* ── Footer date ── */
    .footer {
      border-top: 1px solid rgba(255,255,255,.055);
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--faint);
      font-size: .76rem;
      letter-spacing: .03em;
      animation: fade-up .8s .32s cubic-bezier(.16,1,.3,1) both;
    }
    .footer svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--faint); }

    /* ── Shared anim ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 40px 24px 36px; }
      .logo { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-layer">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- Particles injected by script below -->

  <!-- Main card -->
  <div class="card">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>

    <!-- Spinning ring icon -->
    <div class="icon-ring">
      <svg class="ring-svg" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="34" cy="34" r="32" stroke="rgba(232,98,42,0.15)" stroke-width="1"/>
        <circle cx="34" cy="34" r="32"
          stroke="url(#rg)" stroke-width="1"
          stroke-dasharray="40 162"
          stroke-dashoffset="0"
          stroke-linecap="round"/>
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E8622A"/>
            <stop offset="100%" stop-color="transparent"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="icon-inner">
        <!-- Archive/box icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"/>
          <rect x="1" y="3" width="22" height="5" rx="1"/>
          <line x1="10" y1="12" x2="14" y2="12"/>
        </svg>
      </div>
    </div>

    <div class="logo">Novél<em>ore</em></div>

    <div class="badge">
      <div class="badge-dot"></div>
      Site Archived
    </div>

    <div class="divider"></div>

    <p class="message">
      <strong>NovéLore</strong> has been taken offline and is no longer
      publicly accessible.<br/><br/>
      This site has been archived. Thank you to every reader
      who visited — your support meant everything.
    </p>

    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Archived — June 2026
    </div>
  </div>

  <script>
    // Spawn a small handful of floating particles for atmosphere
    (function () {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 14; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = [
          'left:' + (Math.random() * 100) + '%',
          'bottom:-8px',
          'animation-delay:' + (Math.random() * 18) + 's',
          'animation-duration:' + (18 + Math.random() * 18) + 's'
        ].join(';');
        frag.appendChild(p);
      }
      document.body.appendChild(frag);
    })();
  </script>

</body>
</html>
